[build]
  command = "npm --prefix client install && npm --prefix client run build"
  publish = "client/dist"

# Optional: Proxy /api/* to your deployed Express backend (e.g. Render / Railway)
# Uncomment and replace <YOUR_BACKEND_HOST> once your server/ service is live,
# OR set VITE_API_URL=https://<YOUR_BACKEND_HOST>/api in Netlify Environment Variables.
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://<YOUR_BACKEND_HOST>/api/:splat"
#   status = 200
#   force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
